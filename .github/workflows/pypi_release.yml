name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build dist
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "0.13.x"
        enable-cache: false
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version-file: "pyproject.toml"

    - name: Build package
      run: uv build

    - name: Cache dist
      uses: actions/upload-artifact@v7.0.2
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/matplotlib-window
    permissions:
      id-token: write

    steps:
    - name: Pull dist
      uses: actions/download-artifact@v8.0.2
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.3
      with:
        print-hash: true

  upload-wheel:
    name: Upload wheel to release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Pull dist
      uses: actions/download-artifact@v8.0.2
      with:
        name: dist
        path: dist/

    - name: Upload wheel to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        TAG_NAME: ${{ github.event.release.tag_name }}
      run:
        gh release upload "$TAG_NAME" ./dist/matplotlib_window-*.whl
